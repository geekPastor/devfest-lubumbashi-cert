services:
  - type: web
    name: devfest-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FIREBASE_PROJECT_ID
        value: devfestcert
      - key: FIREBASE_CLIENT_EMAIL
        value: firebase-adminsdk-fbsvc@devfestcert.iam.gserviceaccount.com
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        value: gdgadoekitioffcial@gmail.com
      - key: EMAIL_PASS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_PATH
        value: ./uploads