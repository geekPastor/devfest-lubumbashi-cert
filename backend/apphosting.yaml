# Backend on Firebase App Hosting (Cloud Run)
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Build & start commands
scripts:
  buildCommand: npm ci && npm run build
  runCommand: npm run start

env:
  - variable: NODE_ENV
    value: production
    availability: [RUNTIME]

  # CORS: autorise ton frontend prod (tu ajusteras quand tu auras l’URL Hosting)
  - variable: CORS_ORIGIN
    value: https://gdgl-shigenerator.web.app/
    availability: [RUNTIME]

  - variable: FRONTEND_URL
    value: https://gdgl-shigenerator.web.app/
    availability: [RUNTIME]

  # Secrets (Cloud Secret Manager)
  - variable: JWT_SECRET
    secret: JWT_SECRET
    availability: [RUNTIME]

  - variable: EMAIL_PASS
    secret: EMAIL_PASS
    availability: [RUNTIME]

  - variable: FIREBASE_PROJECT_ID
    value: gdgl-shigenerator
    availability: [RUNTIME]

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability: [RUNTIME]

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability: [RUNTIME]
